name: Build & Release MacAppCleaner

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build Native macOS App & DMG
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Xcode & Swift version
        run: |
          xcodebuild -version
          swift --version

      - name: Package Release DMG & ZIP
        run: |
          chmod +x ./build_app.sh ./package_release.sh
          ./package_release.sh

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MacAppCleaner-Binaries
          path: |
            releases/*.dmg
            releases/*.zip
            releases/checksums.sha256

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            releases/*.dmg
            releases/*.zip
            releases/checksums.sha256
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
